[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshellcage"
version = "1.0.0"
description = "Zero-dependency command injection, argument injection, and environment hijack defense for Python subprocesses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "pyshellcage contributors" }]
keywords = ["security", "subprocess", "command-injection", "argument-injection", "cwe-78", "cwe-88", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
pyshellcage = "pyshellcage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pyshellcage"
Repository = "https://github.com/draarivpatel-ui/pyshellcage"
Issues = "https://github.com/draarivpatel-ui/pyshellcage/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pyshellcage = ["py.typed"]
